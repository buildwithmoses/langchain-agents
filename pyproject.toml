[project]
name = "langchain-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "buildwithmoses", email = "buildhouse.app@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "httpx>=0.28",
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "openevals>=0.2.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.25.0",
]

[project.scripts]
langchain-agents = "langchain_agents:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.39",
    "pytest>=9.2.0",
]
